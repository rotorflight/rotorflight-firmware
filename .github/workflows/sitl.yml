name: SITL

on:
  pull_request:
    branches:
      - 'master'
      - 'RF-*'
  push:
    branches:
      - 'master'

jobs:

  sitl:

    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Install ARM tools
      run: make arm_sdk_install

    - name: Build SITL
      run: make TARGET=SITL

    - name: Smoke test
      run: python3 src/utils/sitl-smoke-test.py obj/main/rotorflight_SITL.elf

    - name: Reboot check
      run: python3 src/utils/sitl/sitl-run-check.py obj/main/rotorflight_SITL.elf

    - name: Scenarios
      run: python3 src/utils/sitl/scenarios.py obj/main/rotorflight_SITL.elf

    - name: ESC check
      run: python3 src/utils/sitl/esc/esc_check.py obj/main/rotorflight_SITL.elf

    - name: Upload SITL executable
      uses: actions/upload-artifact@v4
      with:
        name: rotorflight-SITL-linux-${{ github.sha }}
        path: obj/main/rotorflight_SITL.elf

  sitl-radio:

    # Radio in the loop: EdgeTX (Companion's simulator library) <-> CRSF <-> SITL
    needs: sitl
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Download SITL executable
      uses: actions/download-artifact@v4
      with:
        name: rotorflight-SITL-linux-${{ github.sha }}
        path: obj/main

    - name: Install EdgeTX simulator
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq libgbm1 libwayland-client0 libx11-xcb1 libxkbcommon0 libegl1 libgl1 libfontconfig1 libdbus-1-3
        sudo apt-get install -y -qq libasound2t64 || sudo apt-get install -y -qq libasound2
        gh release download v2.12.5 -R EdgeTX/edgetx -p edgetx-cpn-linux-v2.12.5.zip -D /tmp/edgetx
        cd /tmp/edgetx && unzip -q edgetx-cpn-linux-v2.12.5.zip
        chmod +x EdgeTX_Companion_2.12.5-x86_64.AppImage
        ./EdgeTX_Companion_2.12.5-x86_64.AppImage --appimage-extract > /dev/null
        git clone -q --depth 1 https://github.com/rotorflight/rotorflight-lua-edgetx-suite.git /tmp/edgetx-suite

    - name: Radio check
      run: |
        chmod +x obj/main/rotorflight_SITL.elf
        LD_LIBRARY_PATH=/tmp/edgetx/squashfs-root/usr/lib python3 src/utils/sitl/radio/radio_check.py obj/main/rotorflight_SITL.elf --bindir /tmp/edgetx/squashfs-root/usr/lib/companion212 --sd-template /tmp/edgetx-suite/simulator

  sitl-windows:

    runs-on: windows-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MSYS
        update: false
        install: make curl unzip git

    - name: Install ARM and MinGW tools
      shell: msys2 {0}
      run: make arm_sdk_install mingw_sdk_install

    - name: Build SITL
      shell: msys2 {0}
      run: make TARGET=SITL

    - name: Smoke test
      run: python src/utils/sitl-smoke-test.py obj/main/rotorflight_SITL.elf

    - name: Reboot check
      run: python src/utils/sitl/sitl-run-check.py obj/main/rotorflight_SITL.elf

    - name: Scenarios
      run: python src/utils/sitl/scenarios.py obj/main/rotorflight_SITL.elf

    - name: ESC check
      run: python src/utils/sitl/esc/esc_check.py obj/main/rotorflight_SITL.elf

    - name: Upload SITL executable
      uses: actions/upload-artifact@v4
      with:
        name: rotorflight-SITL-windows-${{ github.sha }}
        path: obj/main/rotorflight_SITL.elf
